image: node:20

cache:
  key:
    files:
      - package.json
  paths:
    - node_modules/

stages:
  - deploy

pages:
  stage: deploy
  script:
    - npm install --no-audit --no-fund
    - npm run build
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
